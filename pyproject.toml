[project]
name = "universal-bot"
version = "0.8.0"
description = "Универсальный Telegram-помощник"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Konstantin Gorin", email = "gorinkv@users.noreply.github.com" }]
dependencies = [
    "aiogram>=3.13,<4",
    "gigachat>=0.1.20",
    "pydantic-settings>=2.5",
    "psutil>=6.0",
    "python-dotenv>=1.0",
    "asyncmy>=0.2.9",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["dict-item", "operator", "union-attr", "assignment"]
