[project]
name = "universal-bot"
version = "0.5.0"
description = "Универсальный Telegram-помощник: задачи, идеи, голос, ИИ"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Konstantin Gorin", email = "gorinkv@users.noreply.github.com" }]
dependencies = [
    "aiogram>=3.13,<4",
    "gigachat>=0.1.20",
    "pydantic-settings>=2.5",
    "psutil>=6.0",
    "python-dotenv>=1.0",
    "asyncmy>=0.2.9",
    "apscheduler>=3.10",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
