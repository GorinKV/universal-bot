name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. СНАЧАЛА ТЕСТЫ (Запускаются всегда: и на PR, и на push)
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Lint with ruff
      run: |
        ruff check app/ tests/

    - name: Type check with mypy
      run: |
        mypy app/

    - name: Test with pytest
      run: |
        pytest tests/ -v

  # 2. ЗАТЕМ ДЕПЛОЙ (ТОЛЬКО ЕСЛИ ТЕСТЫ ПРОШЛИ И ЭТО ПУШ В MAIN)
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: gorinkv.mooo.com
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/universal-bot || exit 1
            LOG=~/deploy.log
            (
              set -e
              echo "=== deploy $(date -Is) ==="
              git pull --ff-only origin main
              . .venv/bin/activate
              pip install -e .
              sudo -n systemctl restart universal-bot
              for i in $(seq 1 20); do
                systemctl is-active --quiet universal-bot && break
                sleep 1
              done
              systemctl is-active universal-bot
              journalctl -u universal-bot --no-pager -n 20
            ) >"$LOG" 2>&1
            status=$?
            tail -n 40 "$LOG"
            exit $status
