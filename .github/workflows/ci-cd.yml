name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. СНАЧАЛА ТЕСТЫ (Запускаются всегда: и на PR, и на push)
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Lint with ruff
      run: |
        ruff check app/ tests/

    - name: Type check with mypy
      run: |
        mypy app/

    - name: Test with pytest
      run: |
        pytest tests/ -v

  # 2. ДЕПЛОЙ
  # Выполняется не здесь, а на самом VPS: systemd-таймер universal-bot-deploy.timer
  # раз в 2 минуты проверяет origin/main и раскатывает коммит, только если этот
  # workflow завершился успешно. Так деплой не зависит от SSH-секретов и от
  # доступности порта 22 с раннеров GitHub.
